; =============================================================================
; Configuration pytest — SAMOURAIS SCRAPPER (vague 0, lot 0.1)
; =============================================================================
; POURQUOI pytest.ini ET PAS pyproject.toml
; -----------------------------------------------------------------------------
; Le projet n'a aujourd'hui AUCUN pyproject.toml. En créer un ne serait pas
; neutre :
;   * un pyproject.toml à la racine fait de ce répertoire un projet PEP 517 ;
;     `pip install .`, `pip install -e .` et divers outils changent alors de
;     comportement, et le Dockerfile fait `COPY . .` — le fichier partirait
;     donc dans l'image de production ;
;   * il faudrait y déclarer [build-system] et [project] pour rester valide,
;     c'est-à-dire prendre des décisions de packaging qui dépassent largement
;     le mandat « aucun changement de comportement » de la vague 0.
; pytest.ini est au contraire lu par pytest et par rien d'autre : c'est le
; support le plus inerte possible. Il fixe aussi la rootdir sans ambiguïté.
; =============================================================================

[pytest]
testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

; --strict-markers  : un marqueur non déclaré ci-dessous = erreur (pas de typo
;                     silencieuse entre les 6 modules de test).
; --strict-config   : une clé inconnue dans ce fichier = erreur.
; --timeout=30      : LOI ABSOLUE n°5 — la suite entière doit tenir sous 60 s ;
;                     un test qui pend (réseau, ffmpeg, thread bloqué) est tué
;                     au lieu de figer la CI.
; -p no:randomly    : non applicable (plugin absent) — l'indépendance à l'ordre
;                     est garantie par la purge de base avant chaque test.
addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --durations=10
    --timeout=30

; MÉCANISME CENTRAL DU CHANTIER (LOI ABSOLUE n°4) :
; un xfail qui réussit fait ÉCHOUER la suite. Le jour où un bug d'AUDIT.md est
; corrigé, le test correspondant passe XPASS et crie « retire ce xfail ».
; Positionné ici en plus du strict=True de chaque marqueur : ceinture ET
; bretelles, un oubli de strict=True reste strict.
xfail_strict = true

; Un warning non prévu est un signal, pas du bruit : il devient une erreur.
; Les tolérances ci-dessous sont limitées aux dépendances tierces que nous
; n'avons pas le droit de corriger (LOI ABSOLUE n°2).
filterwarnings =
    error
    ignore::DeprecationWarning:apscheduler.*
    ignore::DeprecationWarning:dateutil.*
    ignore::DeprecationWarning:google.*
    ignore::DeprecationWarning:httpx.*
    ignore::DeprecationWarning:scrapling.*
    ignore::DeprecationWarning:pkg_resources.*
    ignore:datetime.datetime.utcnow:DeprecationWarning

markers =
    socle: tests du socle de test lui-même (isolation, garde-fous)
    db: schéma, modèles, migrations, cascades (app/db.py)
    web: routes et API Flask (app/web/)
    viewer: API viewer (app/web/viewer_api.py)
    scheduler: APScheduler, machine à états des jobs (app/scheduler.py)
    pipeline: pipeline de scrape (app/scraper/pipeline.py)
    extractor: extracteurs instagram/tiktok/twitter/reddit
    downloader: téléchargement de médias (app/scraper/downloaders.py)
    storage: stockage local et Google Drive (app/storage.py)
    editor: éditeur de mèmes (app/editor/)
    calendar: calendrier de publication (app/calendar/)
    analytics: agrégations analytics (app/analytics/)
    security: tests de sécurité (§6 AUDIT.md)
    static_check: assertions statiques sur des fichiers de configuration
    slow: test dont la durée dépasse 1 seconde

log_cli = false
